name: model-reliability

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "hpcu/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/model-reliability.yml"
  pull_request:
    paths:
      - "hpcu/**"
      - "tests/**"
      - "config/**"
      - ".github/workflows/model-reliability.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint semantic reliability modules
        run: >-
          python -m ruff check
          hpcu/gateway
          hpcu/runtime_config.py
          hpcu/runtime_core/task_budget.py
          hpcu/runtime_core/product_runtime.py
          hpcu/planning/semantic_interrupt.py
          hpcu/compiler/targeting_compiler.py
          hpcu/cases/planning.py
          hpcu/cases/__main__.py
          tests/unit/test_async_gateway.py
          tests/unit/test_async_semantic_pipeline.py
          tests/unit/test_budget_policy.py
          tests/unit/test_product_runtime_boundary.py
          tests/unit/test_product_runtime_resource_policy.py
          tests/unit/test_task_budget_retry.py
          tests/unit/test_gateway_assembly.py
          tests/unit/test_targeting_compiler_reliability.py
      - name: Focused semantic tests
        run: >-
          python -m pytest -q
          tests/unit/test_async_gateway.py
          tests/unit/test_async_semantic_pipeline.py
          tests/unit/test_budget_policy.py
          tests/unit/test_decision.py
          tests/unit/test_targeting.py
          tests/unit/test_minimax_adapter.py
          tests/unit/test_gateway.py
          tests/unit/test_cases.py
          tests/unit/test_model_response_framing.py
          tests/unit/test_targeting_compiler_reliability.py
          tests/unit/test_gateway_assembly.py
          tests/unit/test_task_budget_retry.py
          tests/unit/test_product_runtime_boundary.py
          tests/unit/test_product_runtime_resource_policy.py
          tests/unit/test_run_manifest.py
          tests/unit/test_minimax_diagnostic_normalization.py
