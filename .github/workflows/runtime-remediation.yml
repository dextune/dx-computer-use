name: runtime-remediation

on:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - "hpcu/**"
      - "tests/**"
      - "benchmarks/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/runtime-remediation.yml"
  pull_request:
    paths:
      - "hpcu/**"
      - "tests/**"
      - "benchmarks/**"
      - "config/**"
      - "pyproject.toml"
      - ".github/workflows/runtime-remediation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-remediation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-boundaries:
    name: 1-static-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile all Python modules
        run: python -m compileall -q hpcu tests benchmarks
      - name: Lint runtime and local-resource surface
        run: >-
          python -m ruff check
          hpcu/compiler/targeting_compiler.py
          hpcu/gateway
          hpcu/observation/facade.py
          hpcu/perception/engine.py
          hpcu/planning
          hpcu/runtime_config.py
          hpcu/runtime_core
          hpcu/schemas/budget.py
          hpcu/vision/tesseract_ocr.py
          hpcu/cases
          benchmarks/harness.py
          tests/unit/test_async_gateway.py
          tests/unit/test_async_semantic_pipeline.py
          tests/unit/test_budget_policy.py
          tests/unit/test_observer_concurrency.py
          tests/unit/test_perception_runtime.py
          tests/unit/test_performance_trace.py
          tests/unit/test_product_runtime_resource_policy.py
          tests/unit/test_resource_policy.py

  focused-contracts:
    name: 2-focused-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Runtime local-resource contracts
        run: >-
          python -m pytest -q
          tests/unit/test_async_gateway.py
          tests/unit/test_async_semantic_pipeline.py
          tests/unit/test_budget_policy.py
          tests/unit/test_observer_concurrency.py
          tests/unit/test_observer_facade.py
          tests/unit/test_perception.py
          tests/unit/test_perception_runtime.py
          tests/unit/test_performance_trace.py
          tests/unit/test_product_runtime_boundary.py
          tests/unit/test_product_runtime_resource_policy.py
          tests/unit/test_resource_policy.py
          tests/unit/test_runtime_architecture.py
          tests/unit/test_plan_runtime_contract.py
          tests/unit/test_temporal_runtime.py
          tests/unit/test_runtime_remediation.py
          tests/unit/test_task_budget_retry.py
          tests/unit/test_control_loop.py
          tests/unit/test_executor.py
          tests/unit/test_grounder.py
          tests/unit/test_cases.py
          tests/unit/test_targeting.py
          tests/unit/test_targeting_compiler_reliability.py

  integration-boundaries:
    name: 3-integration-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Integration replay and failure injection
        run: >-
          python -m pytest -q
          tests/integration
          tests/replay
          tests/failure_injection

  full-non-platform:
    name: 4-full-non-platform
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Full portable suite
        run: >-
          python -m pytest -q
          -m "not e2e and not platform_browser and not platform_windows and
          not platform_linux_x11 and not platform_linux_wayland and
          not platform_macos and not platform_remote"

  deterministic-repeat:
    name: 5-deterministic-repeat
    needs:
      - static-boundaries
      - focused-contracts
      - integration-boundaries
      - full-non-platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Repeat deterministic contracts three times
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            echo "deterministic round ${round}"
            python -m pytest -q \
              tests/unit/test_budget_policy.py \
              tests/unit/test_observer_concurrency.py \
              tests/unit/test_perception_runtime.py \
              tests/unit/test_performance_trace.py \
              tests/unit/test_product_runtime_resource_policy.py \
              tests/unit/test_runtime_architecture.py \
              tests/unit/test_plan_runtime_contract.py \
              tests/unit/test_temporal_runtime.py \
              tests/unit/test_task_budget_retry.py \
              tests/integration/test_command_plan_runtime.py
          done
