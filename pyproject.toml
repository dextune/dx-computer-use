[project]
name = "hpcu"
version = "0.1.0"
description = "HPCU Runtime — High-Performance Computer Use Runtime"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jsonschema>=4.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "unit: single function/method, mock, ≤1ms",
    "integration: module boundary, ≤100ms",
    "replay: trajectory replay, ≤500ms",
    "failure_injection: fault injection, ≤1s",
    "e2e: real environment, ≤30s",
    "platform_browser: Playwright fixture",
    "platform_windows: Windows runner only",
    "platform_linux_x11: Xvfb/Docker sandbox",
    "platform_linux_wayland: dedicated runner, default skip",
    "platform_macos: macOS runner + TCC",
    "platform_remote: VNC fixture",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["hpcu"]
branch = true
omit = [
    "hpcu/cases/__main__.py",
]

[tool.coverage.report]
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hpcu", "hpcu.*"]

[tool.ruff]
target-version = "py312"
select = ["N8", "F", "E", "W", "I"]
